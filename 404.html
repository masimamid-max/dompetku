<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dompet Keluarga - Pencatatan Keuangan Keluarga Sederhana & Harmonis</title>
  <meta name="description" content="Aplikasi pencatatan keuangan keluarga sederhana, kolaboratif, dan mudah dipahami untuk membantu seluruh anggota mencatat transaksi, memantau anggaran, dan mengelola arus kas bersama.">
  <meta name="theme-color" content="#059669">

  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="DompetKeluarga">

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Core & Component Stylesheets (Support both Root and Subdirectory) -->
  <link rel="stylesheet" href="css/tokens.css?v=3.16.1">
  <link rel="stylesheet" href="css/layout.css?v=3.16.1">
  <link rel="stylesheet" href="css/components.css?v=3.16.1">
  <link rel="stylesheet" href="css/pages.css?v=3.16.1">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <!-- App Root Shell -->
  <div id="app-shell">
    <div style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:1rem;color:#059669;font-family:'Plus Jakarta Sans',sans-serif;">
      <div style="width:48px;height:48px;border:3px solid #d1fae5;border-top-color:#059669;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
      <div style="font-weight:700;font-size:1.125rem;">Memuat Dompetku...</div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container"></div>

  <!-- Core Scripts -->
  <script src="js/auth-access.js?v=3.17.2"></script>
  <script src="js/bundle.js?v=3.17.2"></script>
  <script>
    // Fallback watchdog: If app hasn't rendered within 2.5s, auto initialize
    setTimeout(function() {
      var shell = document.getElementById('app-shell');
      if (shell && !document.querySelector('.app-main') && !document.querySelector('.access-page')) {
        console.warn('⚡ Watchdog auto-initializing application...');
        if (window.app && typeof window.app.render === 'function') {
          window.app.render();
        } else if (typeof startApp === 'function') {
          startApp();
        } else {
          // Direct fallback to guest / dashboard
          location.reload();
        }
      }
    }, 2500);
  </script>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js').then(function(reg) {
          console.log('⚡ [PWA] Service Worker aktif:', reg.scope);
        }).catch(function(err) {
          console.log('[PWA] Service worker notice:', err);
        });
      });
    }

    // Capture install prompt for PWA
    window.deferredInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      window.deferredInstallPrompt = e;
      var pwaBtn = document.getElementById('btn-install-pwa');
      if (pwaBtn) pwaBtn.style.display = 'inline-flex';
    });
  </script>

  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</body>
</html>
