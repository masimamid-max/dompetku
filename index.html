<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dompet Keluarga - Pencatatan Keuangan Keluarga Sederhana & Harmonis</title>
  <meta name="description" content="Aplikasi pencatatan keuangan keluarga sederhana, kolaboratif, dan mudah dipahami.">
  <meta name="theme-color" content="#059669">

  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.svg">

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Core Stylesheets -->
  <link rel="stylesheet" href="tokens.css" onerror="this.href='css/tokens.css'">
  <link rel="stylesheet" href="layout.css" onerror="this.href='css/layout.css'">
  <link rel="stylesheet" href="components.css" onerror="this.href='css/components.css'">
  <link rel="stylesheet" href="pages.css" onerror="this.href='css/pages.css'">
</head>
<body>
  <!-- App Root Shell -->
  <div id="app-shell">
    <div style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:1rem;color:#059669;font-family:'Plus Jakarta Sans',sans-serif;">
      <div style="width:48px;height:48px;border:3px solid #d1fae5;border-top-color:#059669;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
      <div style="font-weight:700;font-size:1.125rem;">Memuat Dompet Keluarga...</div>
    </div>
  </div>

  <div id="toast-container"></div>

  <!-- Dynamic Script Loader (Loads bundle.js directly) -->
  <script>
    var s = document.createElement('script');
    s.src = 'bundle.js?v=3.2.0';
    s.onerror = function() {
      var s2 = document.createElement('script');
      s2.src = 'js/bundle.js?v=3.2.0';
      document.body.appendChild(s2);
    };
    document.body.appendChild(s);
  </script>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js').then(function(reg) {
          console.log('⚡ [PWA] Service Worker aktif');
        }).catch(function(err) {});
      });
    }
  </script>

  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</body>
</html>
